{# shared setup for the gallery designs (fd_*.html): sizes, footer or logo chip, text styles #}
{# the design file sets story, footer_h, avail and show_leader before including this #}
{% include "_base.html" %}
<style>
  .grp { position: absolute; z-index: 3; display: flex; flex-direction: column; align-items: center;
         justify-content: center; text-align: center; }
  .fs { font: 700 {{ 46 if story else 40 }}px/1.3 "Mukta"; }
  .fb { width: 100%; font-size: {{ 128 if story else 108 }}px; line-height: 1.15; }
  .fe { font-size: {{ 56 if story else 48 }}px; line-height: 1.3; }
  .chip { position: absolute; z-index: 6; top: {{ 34 if story else 26 }}px; left: {{ 34 if story else 26 }}px;
          display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.92); border-radius: 999px;
          padding: 6px 22px 6px 6px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  .chip .ic { width: 58px; height: 58px; border-radius: 50%; background: {{ accent }}; color: #fff; overflow: hidden;
              display: grid; place-items: center; font: 800 30px "Mukta"; }
  .chip .ic img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .chip .nm { font: 800 26px "Mukta"; color: #2B1A0E; white-space: nowrap; }
</style>
