<!doctype html>
<html lang="mr">
<head>
{% set story = (size == 'story') %}
{% include "_custom_base.html" %}
<style>
  .content { align-items: center; text-align: center; justify-content: center; }
  .badge { align-self: center; }
  .kicker { font-size: {{ 50 if story else 40 }}px; color: #7A2E12; line-height: 1.3; }
  .round { flex: 0 1 auto; min-height: 0; aspect-ratio: 1; height: {{ 560 if story else 340 }}px; border-radius: 50%; overflow: hidden;
           border: 10px solid #fff; box-shadow: 0 0 0 8px {{ accent }}, 0 16px 34px rgba(43,26,14,.2); background: #EFE4D2; }
  .round img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; }
  .name { font-size: {{ 86 if story else 68 }}px; line-height: 1.15; width: 100%; }
  .role { font: 800 {{ 40 if story else 34 }}px/1.2 "Mukta"; color: {{ accent }}; }
  .about { font: 600 {{ 32 if story else 27 }}px/1.35 "Mukta"; color: #3B2414; }
</style>
</head>
<body>
  <div class="deco"></div>
  <div class="content fit-box">
    <div class="badge">{{ occasion_label }}</div>
    <div class="kicker calli shrink" data-min="24">{{ headline }}</div>
    <div class="round"><img src="{{ photo_uri }}"></div>
    <div class="name title-art title-saffron fit" data-min="40">{{ f.name }}</div>
    <div class="role shrink" data-min="20">{{ f.role }}</div>
    {% for line in f.about_lines %}<div class="about shrink" data-min="18">{{ line }}</div>{% endfor %}
  </div>
  {% include "_footer.html" %}
  {% include "_fit.html" %}
</body>
</html>
